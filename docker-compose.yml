version: '3.8'

services:

  # ─────────────────────────────────────
  # PostgreSQL Database
  # ─────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: folio_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: folio_db
      POSTGRES_USER: folio_user
      POSTGRES_PASSWORD: folio_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - folio_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U folio_user -d folio_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────
  # Laravel App (PHP-FPM)
  # ─────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: folio_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    networks:
      - folio_network

  # ─────────────────────────────────────
  # Nginx Web Server
  # ─────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: folio_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - folio_network

volumes:
  pgdata:
    driver: local

networks:
  folio_network:
    driver: bridge
